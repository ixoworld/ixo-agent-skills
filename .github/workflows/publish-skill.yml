name: Publish Skill

on:
  push:
    branches: [main]
    paths: ['skills/**']

permissions:
  contents: read

concurrency:
  group: publish-skills
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Build exact commit archives
        env:
          BASE: ${{ github.event.before }}
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: npm run build:capsules -- --base "$BASE" --commit "$COMMIT" --repository "$REPOSITORY"
      - name: Publish and verify stored bytes
        env:
          SKILLS_API_KEY: ${{ secrets.SKILLS_API_KEY }}
          SKILLS_SERVER_URL: https://capsules.skills.ixo.earth
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for receipt in .capsule-build/*.build.json; do
            npm run publish:capsules -- --receipt "$receipt" --registry "$SKILLS_SERVER_URL"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capsule-publication-receipts
          path: .capsule-build/
          include-hidden-files: true
          retention-days: 90
