name: Publish Skill

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  publish:
    name: Publish Skills to Server
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ixoworld/ixo-agent-skills'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Test catalog and packaging
        run: python3 -m unittest discover -s tests -v
      - name: Validate full catalog identities
        run: python3 scripts/skill_catalog.py validate
      - name: Validate and plan the complete push
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/skill_catalog.py plan --base "$BASE_SHA" --head "$HEAD_SHA" --output .publication/plan.json
      - name: Package independent skill capsules
        run: python3 scripts/skill_catalog.py package --plan .publication/plan.json --output-dir .publication/archives --manifest .publication/manifest.json
      - name: Publish planned capsules
        env:
          SKILLS_API_KEY: ${{ secrets.SKILLS_API_KEY }}
          SKILLS_SERVER_URL: https://capsules.skills.ixo.earth
        run: python3 scripts/skill_catalog.py publish --manifest .publication/manifest.json --results .publication/results.json
      - name: Save publication mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capsule-publication
          path: .publication/*.json
          if-no-files-found: ignore
          include-hidden-files: true
