name: IXO Jev Search skill checks
on:
  pull_request:
    paths:
      - 'skills/ixo-jev-search/**'
      - '.github/workflows/ixo-jev-search.yml'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'skills/ixo-jev-search/**'
      - '.github/workflows/ixo-jev-search.yml'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: bash scripts/validate-skill.sh skills/ixo-jev-search
      - run: node --test tests/*.test.mjs
        working-directory: skills/ixo-jev-search
