name: Topic Recipe Author checks
on:
  pull_request:
    paths:
      - 'skills/topic-recipe-author/**'
      - '.github/workflows/topic-recipe-author.yml'
  push:
    branches: [main]
    paths:
      - 'skills/topic-recipe-author/**'
      - '.github/workflows/topic-recipe-author.yml'
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash scripts/validate-skill.sh skills/topic-recipe-author
      - run: python3 -m pip install -r skills/topic-recipe-author/tests/requirements.txt
      - run: python3 -m unittest discover -s skills/topic-recipe-author/tests
