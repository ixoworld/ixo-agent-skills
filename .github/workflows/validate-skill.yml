name: Validate Skill

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Validate actual source archives
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: npm run build:capsules -- --base "$BASE" --commit "$COMMIT" --repository "$REPOSITORY" --include-contracts
      - uses: actions/upload-artifact@v4
        with:
          name: unpublished-capsule-builds
          path: .capsule-build/
          include-hidden-files: true
          retention-days: 90
