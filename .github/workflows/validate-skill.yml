name: Validate Skill

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Skill Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Test catalog and packaging
        run: python3 -m unittest discover -s tests -v
      - name: Validate full catalog identities
        run: python3 scripts/skill_catalog.py validate
      - name: Validate and plan changed skills
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/skill_catalog.py plan --base "$BASE_SHA" --head "$HEAD_SHA" --output .publication/plan.json
      - name: Dry-run capsule packaging
        run: python3 scripts/skill_catalog.py package --plan .publication/plan.json --output-dir .publication/archives --manifest .publication/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: capsule-validation
          path: .publication/*.json
          include-hidden-files: true
