name: Validate Skill

on:
  pull_request:
    paths:
      - 'skills/**'

jobs:
  validate:
    name: Validate Skill Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The default depth of 1 does not include the PR's base commit, so the diff
          # below fails with "fatal: bad object" and reports no changed skills.
          fetch-depth: 0

      - name: Get changed skills
        id: changed-skills
        run: |
          set -euo pipefail

          BASE='${{ github.event.pull_request.base.sha }}'
          HEAD='${{ github.sha }}'

          # Check the range is usable before diffing. This used to fail silently: git wrote
          # to stderr, the pipeline returned the exit status of its last command instead,
          # and an empty result read as "no skills changed" — so the job passed without
          # validating anything.
          for commit in "$BASE" "$HEAD"; do
            if ! git cat-file -e "${commit}^{commit}" 2>/dev/null; then
              echo "::error::Commit $commit is not available in this checkout, so the set of changed skills cannot be determined. Do not treat this as nothing to validate."
              exit 1
            fi
          done

          CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- skills/ | cut -d'/' -f2 | sort -u | tr '\n' ' ')
          echo "skills=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Changed skills: ${CHANGED:-(none)}"

      - name: Validate each skill
        run: |
          set -uo pipefail

          CHANGED='${{ steps.changed-skills.outputs.skills }}'

          # This workflow only runs when skills/** changes, so an empty list means detection
          # broke rather than that there is nothing to check.
          if [ -z "$(echo "$CHANGED" | tr -d '[:space:]')" ]; then
            echo "::error::No changed skills were detected, but this workflow only runs when skills/** changes. Something is wrong with change detection."
            exit 1
          fi

          ERRORS=0
          for SKILL_NAME in $CHANGED; do
            SKILL_DIR="skills/$SKILL_NAME"

            # A PR that removes a skill has nothing left to validate.
            if [ ! -d "$SKILL_DIR" ]; then
              echo "Skipping $SKILL_NAME (deleted)"
              continue
            fi

            echo "::group::Validating $SKILL_NAME"
            # One implementation, shared with what contributors run locally. Duplicating the
            # checks here is how CI came to be the weaker of the two: it never grew the
            # allowed-tools check, and a skill the server rejected passed this job.
            if ! ./scripts/validate-skill.sh "$SKILL_DIR"; then
              echo "::error::$SKILL_NAME failed validation"
              ERRORS=$((ERRORS + 1))
            fi
            echo "::endgroup::"
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Validation failed for $ERRORS skill(s)"
            exit 1
          fi

          echo "All changed skills validated successfully!"
